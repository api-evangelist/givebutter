- aid: givebutter:givebutter
  name: Givebutter
  description: The Givebutter API is a REST API for the Givebutter fundraising and donor-management platform.
    It is organized around resources, speaks JSON, and authenticates with an account-level Bearer API
    key. Givebutter's own published OpenAPI 3.1 describes 70 operations across 42 paths covering campaigns,
    campaign members, teams, tickets and discount codes, contacts with activities and tags, households,
    transactions, funds, payouts, recurring plans, pledges, messages and webhooks, plus an SSO surface.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/givebutter.png
  humanURL: https://docs.givebutter.com/
