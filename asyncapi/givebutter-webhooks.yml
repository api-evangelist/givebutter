description: >-
  Givebutter's event surface. There is NO AsyncAPI document — Givebutter publishes no event spec at
  /asyncapi.yaml, in its GitHub org or in its docs. What it does publish is a webhook management API
  and, inside the create-webhook request body, an enum of the events a subscription may carry. That
  enum is the event catalog and is reproduced here verbatim. Nothing was invented.
asyncapi_document: null
transport: HTTP webhook (provider POSTs to a subscriber URL)
management_api:
  base: https://api.givebutter.com/v1
  operations:
  - operationId: webhooks.index
    binding: GET /v1/webhooks
    summary: List all webhooks
  - operationId: webhooks.store
    binding: POST /v1/webhooks
    summary: Create a webhook
  - operationId: webhooks.show
    binding: GET /v1/webhooks/{webhook}
    summary: Get a webhook
  - operationId: webhooks.update
    binding: PUT /v1/webhooks/{webhook}
    summary: Update a webhook
  - operationId: webhooks.destroy
    binding: DELETE /v1/webhooks/{webhook}
    summary: Delete a webhook
  - operationId: webhooks.activities.index
    binding: GET /v1/webhooks/{webhook}/activities
    summary: List all webhook activities — delivery history for a subscription
  - operationId: webhooks.activities.show
    binding: GET /v1/webhooks/{webhook}/activities/{activity}
    summary: Get a webhook activity
subscription:
  required: [url]
  optional: [event, events, name, enabled]
  note: A subscription takes a single `event` or an `events` array drawn from the enum below, a
    target url, an optional name (max 255) and an enabled flag.
events:
- name: campaign.created
