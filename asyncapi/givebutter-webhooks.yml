other_activity_types_in_spec:
- note: >-
    The contact-activity schemas carry a separate set of dot-named values (campaign.joined,
    email.subscribed, email.unsubscribed, sms.subscribed, sms.unsubscribed, signup_form.submitted,
    recurring_plan.created, recurring_plan.activated, recurring_plan.canceled,
    transaction.acknowledged, transaction.recieved [sic], transaction.unacknowledged,
    video_message.sent, video_message.deleted, custom_field.updated, ticket.issued). These are
    CRM activity-feed types on the contact timeline, NOT subscribable webhook events, and are
    recorded here so they are not mistaken for one another.
gaps:
- No AsyncAPI or CloudEvents description is published.
- No webhook signing secret, signature header or replay-protection scheme is documented, so a
  receiver cannot verify that a delivery came from Givebutter.
- No retry or delivery-guarantee policy is documented; delivery history is inspectable only through
  the webhook activities endpoints.
- No payload schema is published for any event — the spec describes the subscription object, not
  the event body.
