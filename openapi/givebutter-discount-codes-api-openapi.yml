  /v1/campaigns/{campaign}/discount-codes/{discountCode}:
    get:
      operationId: campaigns.discount-codes.show
      summary: Get a discount code
      tags:
      - Campaign Discount Codes
      parameters:
      - name: campaign
        in: path
        required: true
        description: The campaign ID
        schema:
          type: integer
      - name: discountCode
        in: path
        required: true
        description: The discount code ID
