openapi: 3.2.0
info:
  title: Givebutter API Documentation Households API
  version: 1.0.0
  description: Givebutter Public API - Access and manage your campaigns, contacts, transactions, and more.
servers:
- url: https://api.givebutter.com/
security:
- http: []
tags:
- name: Households
paths:
  /v1/households:
    get:
      operationId: households.index
      summary: List all households
      tags:
      - Households
      parameters:
      - name: headContactId
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: contacts
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: query
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: sortBy
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: sortByDesc
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        schema:
          type: string
          default: 1
      responses:
        '200':
          description: Array of `HouseholdResource`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HouseholdResource'
        '422':
          $ref: '#/components/responses/ValidationException'
    post:
      operationId: households.store
      summary: Create a household
      tags:
      - Households
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdStoreRequest'
      responses:
        '200':
          description: '`App.Http.Resources.API.HouseholdResource`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App.Http.Resources.API.HouseholdResource'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
  /v1/households/{household}:
    get:
      operationId: households.show
      summary: Get a household
      tags:
      - Households
      parameters:
      - name: household
        in: path
        required: true
        description: The household ID
        schema:
          type: integer
      responses:
        '200':
          description: '`App.Http.Resources.API.HouseholdResource`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App.Http.Resources.API.HouseholdResource'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
    put:
      operationId: households.update
      summary: Update a household
      tags:
      - Households
      parameters:
      - name: household
        in: path
        required: true
        description: The household ID
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdUpdateRequest'
      responses:
        '200':
          description: '`App.Http.Resources.API.HouseholdResource`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App.Http.Resources.API.HouseholdResource'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
        '422':
          $ref: '#/components/responses/ValidationException'
    delete:
      operationId: households.destroy
      summary: Delete a household
      tags:
      - Households
      parameters:
      - name: household
        in: path
        required: true
        description: The household ID
        schema:
          type: integer
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
