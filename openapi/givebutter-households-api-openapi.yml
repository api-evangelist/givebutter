      - primary_email
      - primary_phone
      - is_email_subscribed
      - is_phone_subscribed
      - is_address_subscribed
      - address_unsubscribed_at
      - note
      - addresses
      - primary_address
      - archived_at
      - created_at
      - updated_at
      - first_time_supporter_at
