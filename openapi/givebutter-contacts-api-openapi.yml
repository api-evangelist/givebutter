      - name: createdAfter
        in: query
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - name: createdBefore
        in: query
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - name: updatedAfter
        in: query
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - name: updatedBefore
        in: query
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - name: totalContributionsMin
        in: query
        schema:
          type:
          - number
          - 'null'
      - name: totalContributionsMax
        in: query
        schema:
          type:
          - number
          - 'null'
      - name: recurringContributionsMin
        in: query
        schema:
          type:
          - number
          - 'null'
      - name: recurringContributionsMax
        in: query
        schema:
          type:
          - number
          - 'null'
      - name: tags
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: sortBy
        in: query
        schema:
          type:
          - string
          - 'null'
          enum:
          - name_or_company
          - primary_email
          - point_of_contact
          - created_at
          - total_contributions
          - recurring_contributions
          - last_donation_amount
      - name: sortByDesc
        in: query
        schema:
          type:
          - string
          - 'null'
          enum:
          - name_or_company
          - primary_email
          - point_of_contact
          - created_at
          - total_contributions
          - recurring_contributions
          - last_donation_amount
      - name: email
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: primaryEmail
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: firstName
        in: query
        schema:
          type:
          - string
          - 'null'
          maxLength: 1000
      - name: lastName
        in: query
        schema:
          type:
          - string
          - 'null'
          maxLength: 1000
      responses:
        '200':
          description: Paginated set of `ContactResource`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactResource'
                  links:
                    type: object
                    properties:
                      first:
                        type:
                        - string
                        - 'null'
                      last:
                        type:
                        - string
                        - 'null'
                      prev:
                        type:
                        - string
                        - 'null'
                      next:
                        type:
                        - string
                        - 'null'
                    required:
                    - first
                    - last
                    - prev
                    - next
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        minimum: 1
                      from:
                        type:
                        - integer
                        - 'null'
                        minimum: 1
                      last_page:
                        type: integer
                        minimum: 1
                      links:
                        type: array
                        description: Generated paginator links.
                        items:
                          type: object
                          properties:
                            url:
                              type:
                              - string
                              - 'null'
                            label:
                              type: string
                            active:
                              type: boolean
                          required:
                          - url
                          - label
                          - active
                      path:
                        type:
                        - string
                        - 'null'
                        description: Base path for paginator generated URLs.
                      per_page:
                        type: integer
                        description: Number of items shown per page.
                        minimum: 0
                      to:
                        type:
                        - integer
                        - 'null'
                        description: Number of the last item in the slice.
                        minimum: 1
                      total:
                        type: integer
                        description: Total number of items being paginated.
                        minimum: 0
                    required:
                    - current_page
                    - from
                    - last_page
                    - links
                    - path
                    - per_page
                    - to
                    - total
                required:
                - data
                - links
                - meta
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
    post:
      operationId: contacts.store
      summary: Create a contact
      tags:
      - Contacts
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/StoreContactRequest'
              - type: object
                properties:
                  force_create:
                    type: boolean
                    default: false
