        '200':
          description: '`ContactResource`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResource'
        '422':
          $ref: '#/components/responses/ValidationException'
  /v1/contacts/{contact}:
    get:
      operationId: contacts.show
      summary: Get a contact
      tags:
      - Contacts
      parameters:
      - name: contact
        in: path
        required: true
        description: The contact ID
        schema:
          type: integer
      responses:
        '200':
          description: '`ContactResource`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResource'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
    put:
      operationId: contacts.update
      summary: Update a contact
      tags:
      - Contacts
      parameters:
      - name: contact
        in: path
        required: true
        description: The contact ID
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactRequest'
      responses:
        '200':
          description: '`ContactResource`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResource'
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '422':
          $ref: '#/components/responses/ValidationException'
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
    delete:
      operationId: contacts.destroy
      summary: Delete a contact
      tags:
      - Contacts
      parameters:
      - name: contact
        in: path
        required: true
        description: The contact ID
        schema:
          type: integer
      responses:
        '200':
          description: ''
        '403':
          $ref: '#/components/responses/AuthorizationException'
        '404':
          $ref: '#/components/responses/ModelNotFoundException'
  /v1/contacts/{contact}/restore:
    patch:
      operationId: contact.restore
      summary: Restore a contact
      tags:
      - Contacts
      parameters:
      - name: contact
        in: path
        required: true
        description: The contact ID
        schema:
          type: integer
      responses:
        '200':
          description: '`ContactResource`'
          content:
