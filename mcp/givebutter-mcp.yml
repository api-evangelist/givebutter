generated: '2026-09-12'
method: probed
source: https://mcp.givebutter.com/mcp (probed 2026-09-12) + https://registry.npmjs.org/@givebutter/mcp
status: gated
description: >-
  Givebutter ships TWO first-party MCP surfaces. A remote server at https://mcp.givebutter.com/mcp,
  which an MCP client can POST to today and which is protected by OAuth 2.1 (RFC 9728 challenge,
  authorization server https://auth.givebutter.com, scope "mcp", PKCE S256, dynamic client
  registration). And a local stdio server published to npm as @givebutter/mcp, described by the
  provider as the "Official Givebutter MCP Server", which wraps @givebutter/sdk and needs a
  GIVEBUTTER_API_KEY. The two are not the same product and the remote one is the agent surface.
server:
  name: givebutter
  transport: http
  url: https://mcp.givebutter.com/mcp
deployment:
  mode: both
  endpoint: https://mcp.givebutter.com/mcp
  install: npx -y @givebutter/mcp
  package: https://www.npmjs.com/package/@givebutter/mcp
  auth: oauth
  verified: probed
  checked: '2026-09-12'
  notes:
  - remote endpoint probed 2026-09-12 — HTTP 401 with www-authenticate Bearer realm="mcp",
    resource_metadata="https://mcp.givebutter.com/.well-known/oauth-protected-resource"; the endpoint
    is live and reachable, the tool list is auth-gated
  - the stdio package authenticates with a Givebutter API key (api-key), not OAuth — auth above
    records the remote surface
