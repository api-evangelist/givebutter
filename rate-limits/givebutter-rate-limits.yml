specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Givebutter
providerId: givebutter
generated: '2026-09-12'
method: searched
source: https://docs.givebutter.com/api-reference/rate-limits
created: '2025-05-04'
modified: '2026-09-12'
tags:
- Donations
- Fundraising
- Nonprofits
- Rate Limiting
description: >-
  Published rate limits for the Givebutter API, read from Givebutter's own Rate Limits page on
  2026-09-12. This file previously carried scaffold tier limits that Givebutter never published;
  those have been removed. Givebutter publishes ONE flat limit and one response signal.
headers:
  retryAfter: Retry-After
  limit: null
  remaining: null
  reset: null
  policy: null
headers_note: >-
  Only Retry-After is documented. No X-RateLimit-* or RFC 9239 RateLimit-* budget headers are
  documented, so a client cannot observe its remaining budget before it is throttled. (An
  x-ratelimit-limit header IS returned by the separate MCP endpoint at mcp.givebutter.com, observed
  as 5 on an unauthenticated probe, but that is the MCP surface, not the REST API.)
responseCodes:
  throttled: 429
  quotaExceeded: 429
limits:
- name: Global API rate limit
  scope: account
  metric: requests_per_minute
  limit: 500
  timeFrame: minute
  burst: null
  applies:
  - Givebutter
  evidence: 'The Givebutter API is rate limited to 500 requests per minute.'
  source: https://docs.givebutter.com/api-reference/rate-limits
limit_count: 1
policies:
- name: Retry-After
  description: >-
    When you exceed the limit you receive 429 Too Many Requests with a Retry-After header indicating
    how many seconds to wait before retrying. Quoted from the provider's Rate Limits page.
- name: No tiered limits published
  description: >-
    Givebutter publishes no per-plan, per-endpoint or per-key rate differentiation. The Free plan and
    Givebutter Plus are not described as having different API limits.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
