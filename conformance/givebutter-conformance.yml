domain_standard:
  declared: false
  checked: '2026-09-12'
  note: >-
    Givebutter's market — nonprofit fundraising and donor management — has no widely adopted
    machine-readable domain standard of the kind this check rewards (no SCIM URN, OData $metadata,
    OpenRTB, LTI/OneRoster, OAI-PMH, HL7/X12/ISO 20022 message type appears in the contract). The
    regulated surface Givebutter touches is card payments, and there PCI compliance is held by its
    processor (Stripe) rather than declared in Givebutter's own contract. Nothing is asserted here.
