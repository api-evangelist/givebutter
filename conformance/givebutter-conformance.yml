    component schemas, document-level security
- id: oauth2
  conforms: true
  evidence: https://auth.givebutter.com/.well-known/oauth-authorization-server — authorization_code
    and refresh_token grants, code response type
- id: rfc8414-authorization-server-metadata
  conforms: true
  evidence: https://auth.givebutter.com/.well-known/oauth-authorization-server (HTTP 200, issuer,
    authorization_endpoint, token_endpoint, scopes_supported)
- id: rfc9728-protected-resource-metadata
  conforms: true
  evidence: https://mcp.givebutter.com/.well-known/oauth-protected-resource (HTTP 200) and the
    www-authenticate challenge returned by https://mcp.givebutter.com/mcp
- id: rfc7636-pkce
  conforms: true
  evidence: code_challenge_methods_supported ["S256"] in the authorization-server metadata
- id: rfc7591-dynamic-client-registration
  conforms: true
