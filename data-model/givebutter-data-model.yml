findings:
- Two schemas are published under their internal Laravel class paths (App.Http.Resources.API.AddressResource,
  App.Http.Resources.API.HouseholdResource), duplicating AddressResource and HouseholdResource. A generated client
  will emit two types for one entity.
- Identifiers are bare integers, not prefixed strings, so an id carries no type information; an agent holding
  4821 cannot tell a contact from a campaign.
- 'The relationship graph is shallow: 6 of 33 resource schemas carry an inline $ref to another resource. Most
  association is expressed through *_id integer fields (account_id, head_contact_id, campaign_id) that the spec
  does not link to a target schema.'
